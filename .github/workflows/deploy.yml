name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: BijanProgrammerWebsites/hub/.github/workflows/deploy-vite.yml@master
    with:
      domain: canban.ir
      base-href: /
    secrets:
      SERVER_HOST: ${{secrets.SERVER_HOST}}
      SERVER_USERNAME: ${{secrets.SERVER_USERNAME}}
      SERVER_PORT: ${{secrets.SERVER_PORT}}
      SERVER_SSH_KEY: ${{secrets.SERVER_SSH_KEY}}
      ENV_FILE: ${{ secrets.ENV_FILE }}
